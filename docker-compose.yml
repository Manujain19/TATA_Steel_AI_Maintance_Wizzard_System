services:
  backend:
    build: .
    container_name: maintenance-wizard-backend
    ports:
      - "8012:8012"
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-groq}
      - VECTOR_DB=${VECTOR_DB:-chromadb}
      - DATABASE_URL=postgresql://maintenance:maintenance@postgres:5432/maintenance_wizard
      - ENABLE_POSTGRES=true
      - CHROMA_PATH=/app/.vectorstores/chromadb
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      - postgres
      - chromadb
      - qdrant
    volumes:
      - .:/app
  frontend:
    build: .
    container_name: maintenance-wizard-frontend
    command: ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8013"]
    ports:
      - "8013:8013"
    depends_on:
      - backend
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: maintenance
      POSTGRES_PASSWORD: maintenance
      POSTGRES_DB: maintenance_wizard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  chroma_data:
  qdrant_data:
